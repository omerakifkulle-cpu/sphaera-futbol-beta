<title>Sphaera - Beta test</title>
<style>
:root{color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:#22432A;color:#FFFFFF;font-family:system-ui,'Segoe UI',Arial,sans-serif}
header{display:flex;justify-content:space-between;align-items:center;padding:20px 28px;border-bottom:1px solid #3F7049}
.logo{font-size:20px;font-weight:700}
.wrap{display:grid;grid-template-columns:320px 1fr;min-height:calc(100vh - 70px)}
aside{background:#C8973A;color:#0F2A17;padding:32px 24px;display:flex;flex-direction:column;gap:12px;border-right:1px solid #9E7429}
aside h3{margin:0 0 8px;font-size:13px;letter-spacing:.08em;text-transform:uppercase}
.satir{display:flex;gap:8px;padding:10px;border-radius:8px;font-size:15px}
.satir.ilk{background:#B5822F;border-left:3px solid #0F2A17}
.satir div:first-child{width:22px}
.satir div:nth-child(2){flex:1}
.satir div:last-child{width:32px;text-align:right}
aside small{font-size:12px;margin-top:auto;line-height:1.5}
